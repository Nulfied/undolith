[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "undolith"
version = "0.3.0"
description = "Simulate, commit and undo AI agent tool calls, with a signed, hash-chained action ledger."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nulfied" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai-agents", "rollback", "undo", "audit-log", "llm", "mcp", "langchain", "safety", "regression-testing", "evals", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
fast = ["cryptography>=41"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Nulfied/undolith"
Specification = "https://github.com/Nulfied/undolith/blob/main/SPEC.md"
Issues = "https://github.com/Nulfied/undolith/issues"

[project.scripts]
undolith = "undolith.cli:main"

[tool.setuptools.packages.find]
include = ["undolith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
